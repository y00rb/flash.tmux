[package]
name = "flash-tmux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Flash-style label navigation in tmux copy-mode"
repository = "https://github.com/y00rb/flash.tmux"

[dependencies]
crossterm = "0.29"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "flash-tmux"
path = "src/main.rs"
